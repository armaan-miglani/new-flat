<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">

<title>New Home 3D Walkthrough</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen app — two toolbars on top, 3D view fills the rest, design notes slide over from the right */
:root {
  --bg: #f6f7f5; --paper: #ffffff; --ink: #1f2a2e; --muted: #5d6b70; --line: #c9d2d4;
  --accent: #b5562a; --chip: #eef1ef; --scene: #dde5e7;
  --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #13191b; --paper: #1a2225; --ink: #e4ebec; --muted: #98a7ab; --line: #34454a;
  --accent: #e08a5c; --chip: #232d30; --scene: #1d2629; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #13191b; --paper: #1a2225; --ink: #e4ebec; --muted: #98a7ab; --line: #34454a;
  --accent: #e08a5c; --chip: #232d30; --scene: #1d2629; color-scheme: dark }
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; overflow: hidden; }
.app { height: 100%; display: flex; flex-direction: column; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--paper); border-bottom: 1px solid var(--line); }
@media (max-width: 560px) { .bar.top { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; } .bar.top::-webkit-scrollbar { display: none; } .bar.top > * { flex: none; } }
.bar h1 { font-size: 16px; margin: 0; font-weight: 600; white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; flex: none; }
.seg button { border: 0; background: transparent; color: var(--ink); font: 500 13px var(--sans); padding: 6px 11px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.lbl { font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.grp { display: inline-flex; align-items: center; gap: 6px; flex: none; }
.chips { display: flex; gap: 6px; overflow-x: auto; min-width: 0; flex: 1 1 300px; scrollbar-width: thin; }
.chips button { flex: none; border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px; font: 500 12.5px var(--sans); padding: 5px 11px; cursor: pointer; }
.notesBtn { border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 6px; font: 600 13px var(--sans); padding: 6px 12px; cursor: pointer; flex: none; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.view { position: relative; flex: 1; min-height: 0; background: var(--scene); touch-action: none; overflow: hidden; }
.view canvas { display: block; width: 100%; height: 100%; cursor: grab; }
.hud { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); top: 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: 500 13px var(--mono); }
.help { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; max-width: min(360px, 60%); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.pad { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px; display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(2, 44px); gap: 6px; }
.pad button { border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 8px; font-size: 16px; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none; }
.pad .up { grid-column: 2; grid-row: 1; } .pad .lt { grid-column: 1; grid-row: 2; } .pad .dn { grid-column: 2; grid-row: 2; } .pad .rt { grid-column: 3; grid-row: 2; }
.notes { position: absolute; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--paper); border-left: 1px solid var(--line); overflow-y: auto; padding: 18px max(18px, env(safe-area-inset-right, 0px)) 28px 18px; display: grid; gap: 16px; align-content: start; touch-action: pan-y; }
.notes h2 { font-size: 19px; margin: 0; }
.notes h3 { font-size: 14.5px; margin: 0 0 4px; }
.notes p, .notes li { color: var(--muted); font-size: 13.5px; line-height: 1.5; margin: 0; }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
.notes .room { border-top: 1px solid var(--line); padding-top: 12px; }
.notes .tag { font: 500 11px var(--mono); color: var(--accent); letter-spacing: .05em; text-transform: uppercase; }
.notes .close { justify-self: end; border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 6px; padding: 5px 10px; cursor: pointer; font: 500 13px var(--sans); }
.rbs { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
.rbs td { border-top: 1px solid var(--line); padding: 5px 6px; vertical-align: top; color: var(--muted); }
.rbs td:first-child { color: var(--ink); font-weight: 500; width: 38%; }
.rbs th { text-align: left; padding: 10px 6px 4px; font: 600 11px var(--mono); letter-spacing: .05em; text-transform: uppercase; }
.rbs th.r { color: #3f7fb0; } .rbs th.b { color: #3f8a4f; } .rbs th.s { color: var(--accent); }
.sw { display: flex; gap: 6px; } .sw i { width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--line); }
.seats { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); top: 52px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 12.5px; max-width: min(300px, 60%); line-height: 1.4; }
.seats b { font-weight: 600; }
.fcard { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: min(320px, calc(100% - 24px)); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 6px; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
.fcard[hidden] { display: none; }
.fcard .tag { font: 500 11px var(--mono); color: var(--accent); letter-spacing: .05em; text-transform: uppercase; }
.fcard p { margin: 0; color: var(--muted); line-height: 1.45; }
.fcard .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.fcard button { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 6px; padding: 5px 10px; cursor: pointer; font: 500 13px var(--sans); }
.fcard button.main { background: var(--ink); color: var(--paper); border-color: var(--ink); }
@media (max-width: 560px) { .fcard { top: 52px; } }
.err { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); padding: 24px; text-align: center; }
.pieces { position: absolute; top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); width: min(300px, calc(100% - 140px)); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; font-size: 13px; max-height: calc(100% - 130px); overflow-y: auto; }
.pieces > button { width: 100%; display: flex; justify-content: space-between; gap: 8px; border: 0; background: transparent; color: var(--ink); font: 600 13px var(--sans); padding: 8px 10px; cursor: pointer; text-align: left; }
.pieces .row { border-top: 1px solid var(--line); padding: 8px 10px; display: grid; gap: 5px; }
.pieces .row.sel { background: var(--chip); }
.pieces .row b { font-weight: 600; }
.opts { display: grid; gap: 4px; }
.opts button { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; text-align: left; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 5px; padding: 5px 7px; font: 500 12.5px var(--sans); cursor: pointer; }
.opts button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.opts button small { grid-column: 1 / -1; color: var(--muted); font: 400 11.5px var(--sans); }
.opts button .pr { font: 500 12px var(--mono); }
.opts a { color: var(--accent); font-size: 12px; }
.pieces .tot { border-top: 1px solid var(--line); padding: 8px 10px; display: flex; justify-content: space-between; font: 500 12.5px var(--mono); }
@media (max-width: 560px) { .help { display: none; } .pieces { top: auto; bottom: 120px; width: calc(100% - 24px); max-height: 45%; } }
</style>

    <div class="fcard" id="fcard" hidden role="dialog" aria-label="Filler"></div>
    <aside class="notes" id="notes" hidden aria-label="Design notes"></aside>
  </div>
</div>

<script>
(function () {
  const view = document.getElementById('view');
  if (!window.THREE) { view.innerHTML = '<div class="err">The 3D library did not load. Reload the page to try again.</div>'; return; }

  // ---- plan data, in feet (x east, y south), matches the 2D floor plan ----
  const H = 9.5, T = 0.4, G = 0.5, EYE = 5.2;
  const ROOMS = [
    { name: 'Separate area', x: 10, y: 8, w: 4, h: 6, floor: 'tile' }, // measured: ~3.8 x 6.3 ft inside; its back wall is in line with your bed wall (the 0.4 ft walls make it draw a little smaller inside)
    { name: 'My Bedroom', x: 14, y: 8, w: 12, h: 12, floor: 'tile' }, // measured: the wardrobe fills the 12 ft east wall
    { name: 'Bedroom 2', x: 4, y: 14, w: 10, h: 9, floor: 'tile' }, // its door sits at your door's corner; the wall on the left as you enter starts at the frame
    { name: 'Passage', x: 14, y: 20, w: 4, h: 10.5, floor: 'tile' },
    { name: 'My Bathroom', x: 18, y: 20, w: 7.5, h: 5, floor: 'wet' },
    { name: '2nd Bathroom', x: 18, y: 25, w: 7.5, h: 5.5, floor: 'wet' },
    { name: 'Utility', x: 0, y: 23, w: 4, h: 7.5, floor: 'out' }, // above the balcony, same 4 ft width
    { name: 'Kitchen', x: 4, y: 23, w: 10, h: 7.5, floor: 'tile' }, // runs the full stretch from the utility wall to the passage, in line with Bedroom 2 and the living room
    { name: 'Balcony', x: 0, y: 30.5, w: 4, h: 12, floor: 'out' },
    { name: 'Living', x: 4, y: 30.5, w: 23, h: 12, floor: 'tile', label: 'Living + Dining' },
  ];
  const UNKNOWNS = []; // the measured plan has no unseen gaps left
  const OPENINGS = [
    ['h', 20, 14, 17.2, 'door'], ['v', 14, 20, 23, 'door'], ['v', 18, 25.6, 28.4, 'door'],
    ['h', 20, 20.5, 23, 'door'], ['v', 4, 25, 28, 'door'], ['h', 42.5, 14.5, 18.5, 'door'],
    ['h', 30.5, 14, 18, 'open'], ['v', 14, 25.6, 28.4, 'open'], ['v', 4, 32.4, 41.1, 'open'], ['v', 14, 8.3, 10.9, 'iwin'], ['v', 14, 11.0, 13.8, 'door'],
    ['v', 10, 8.7, 13.3, 'window'], ['h', 8, 10.4, 13.6, 'window'], ['v', 4, 16, 21, 'window'], ['h', 14, 11, 13.2, 'window'],
    ['v', 0, 24.5, 29, 'window'], ['v', 0, 31, 42, 'rail'],
    ['v', 25.5, 21.3, 23.7, 'vent'], ['v', 25.5, 26.2, 28.8, 'vent'],
  ];
  const SPANS = { wall: [[0, H]], iwin: [[0, 3.2], [7, H]], door: [[7, H]], open: [[8, H]], window: [[0, 3], [7, H]], vent: [[0, 4.6], [6.6, H]], rail: [[0, 3.5]] };
  const BLOCKS = new Set(['wall', 'window', 'vent', 'rail', 'iwin']);
  const GLASS = { window: [3, 7], vent: [4.6, 6.6] };

  function region(px, py) {
    for (const U of UNKNOWNS) if (px > U.x && px < U.x + U.w && py > U.y && py < U.y + U.h) return 'unk';
    for (let i = 0; i < ROOMS.length; i++) { const r = ROOMS[i]; if (px > r.x && px < r.x + r.w && py > r.y && py < r.y + r.h) return i; }
    return null;
  }
  function edgeType(o, line, mid, a, b) {
    if (a === b) return null;
    const outA = a === null || a === 'unk', outB = b === null || b === 'unk';
    if (outA && outB) return null;
    for (const op of OPENINGS) if (op[0] === o && op[1] === line && mid > op[2] && mid < op[3]) return op[4];
    return 'wall';
  }
  const segs = [];
  function sweep(o) {
    const lines = o === 'v' ? 27 / G : 42.5 / G, steps = o === 'v' ? 42.5 / G : 27 / G;
    for (let i = 0; i <= lines; i++) {
      const line = i * G; let run = null;
      for (let j = 0; j <= steps; j++) {
        let t = null;
        if (j < steps) {
          const m = j * G + G / 2;
          t = o === 'v' ? edgeType(o, line, m, region(line - G / 2, m), region(line + G / 2, m))
                        : edgeType(o, line, m, region(m, line - G / 2), region(m, line + G / 2));
        }
        if (run && run.type !== t) { segs.push(run); run = null; }
        if (t && !run) run = { o, line, a: j * G, b: j * G + G, type: t };
        else if (t) run.b = j * G + G;
      }
    }
  }
  sweep('v'); sweep('h');

  // ---- design styles ----
  const STYLES = {
    japandi: { name: 'Japandi', title: 'Warm Japandi', wood: 0x8a5f3c, wood2: 0x6e4a2c, fabric: 0xe4dbcc, accent: 0x8a9a78, rug: 0xd6c9b1, dark: 0x2f2a25, shade: 0xf6ecdb, metal: 0x2a2a2a, art: 0xb9a68a, wall: 0xefe8d6, pot: 0xd9cfc0, lamp: 'paper', deskNook: 0x5a3c25, sheer: 0xf6f1e8, curtain: 0xb9ab95, curtain2: 0xbcae95, blind: 0xe7dccb, blindKind: 'roman', rugBase: 0xc6a77a, rugLine: 0x3b2f25, rugKind: 'stripe', sofa: 0xb3a391, cush: 0x8a9a78,
      blurb: 'Walnut, linen and paper lanterns, with black accents and sage. Low furniture, clean lines, a few plants and nothing on the walls that does not earn its place.',
      search: 'japandi living room walnut and sage, japandi walnut bedroom, paper lantern pendant',
      swatch: ['#8a5f3c', '#b3a391', '#9aa78a', '#c6a77a', '#2a2a2a'] },
    boho: { name: 'Boho', title: 'Earthy Boho', wood: 0xa8743f, wood2: 0x8a5a2e, fabric: 0xe2cfb3, accent: 0xc0623b, rug: 0xb57a52, dark: 0x4a3426, shade: 0xc9a066, metal: 0x3a2d22, art: 0xd08a5a, wall: 0xf2e6d3, pot: 0xb5704a, lamp: 'rattan', deskNook: 0x3d2b1f, sheer: 0xf4ebdc, curtain: 0xbfae94, curtain2: 0xc8b89b, blind: 0xb68a52, blindKind: 'bamboo', rugBase: 0xe3cfae, rugLine: 0x8f6a48, rugKind: 'kilim', sofa: 0xd5c6ab, cush: 0xb5653f,
      blurb: 'Rattan, cane and terracotta with lots of plants. Layered rugs and woven lamp shades that throw patterned light in the evening.',
      search: 'boho living room rattan lamp, terracotta boho bedroom, boho balcony string lights',
      swatch: ['#a8743f', '#e2cfb3', '#c0623b', '#b57a52', '#4a3426'] },
    moody: { name: 'Moody · best fit', title: 'Modern Moody (best fit for this flat)', wood: 0x5c4030, wood2: 0x3e2b20, fabric: 0x5d6650, accent: 0xb8893d, rug: 0x7d756b, dark: 0x1d2124, shade: 0xf1e7d4, metal: 0xb8893d, art: 0x8c6a4a, wall: 0xd8d2c6, pot: 0x2b2f31, lamp: 'globe', deskNook: 0x3e2b20, sheer: 0xf1ebe0, curtain: 0x7a6f62, curtain2: 0x7a6a58, blind: 0x5c4030, blindKind: 'wood', rugBase: 0x55504a, rugLine: 0xd9cdb8, rugKind: 'plain', sofa: 0x9a5c32, cush: 0x8e9a7e,
      blurb: 'Walnut, brass and olive accents on a neutral sofa, with opal glass globe lamps. Darker wood and warm lamps make it feel like a hotel lounge, and the olive picks up the pistachio kitchen.',
      search: 'moody modern living room olive sofa, walnut bedroom brass lamp, globe pendant dining',
      swatch: ['#5c4030', '#5d6650', '#b8893d', '#7d756b', '#d8d2c6'] },
    calm: { name: 'Calm', title: 'Calm warm neutrals', wood: 0x5c4030, wood2: 0x3e2b20, fabric: 0xd9cfbf, accent: 0x9aa58f, rug: 0xcfc4b0, dark: 0x2a2622, shade: 0xf3ead9, metal: 0x8f8a80, art: 0xb8a88f, wall: 0xe9e1d2, pot: 0xd9cfc0, lamp: 'paper', deskNook: 0x3e2b20, sheer: 0xf6f1e8, curtain: 0xcfc3ae, curtain2: 0xc8bca6, blind: 0xe7dccb, blindKind: 'roman', rugBase: 0xd8ccb6, rugLine: 0xa89a82, rugKind: 'stripe', sofa: 0xb9ad9c, cush: 0xd9cfbf,
      blurb: 'Greige and oatmeal upholstery, cream headboards and walnut wood for contrast, with texture from chenille, linen and a jute rug. Quiet, easy to live with, and it will not blend into the cream walls because the wood stays dark.',
      search: 'warm neutral living room greige sofa walnut, cream upholstered bed walnut, calm minimal bedroom linen',
      swatch: ['#5c4030', '#b9ad9c', '#d9cfbf', '#9aa58f', '#e9e1d2'] },
  };

  // ---- scene ----
  const css = getComputedStyle(document.documentElement);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  view.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  const DAY_BG = new THREE.Color(0xcfe2ee), EVE_BG = new THREE.Color(0x15181c);
  const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 400);
  camera.rotation.order = 'YXZ';

  const amb = new THREE.AmbientLight(0xfffaf0, 0.55); scene.add(amb);
  const hemi = new THREE.HemisphereLight(0xffffff, 0xd8cfbf, 0.35); scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff1d6, 0.7); sun.position.set(-40, 35, 18); scene.add(sun);
  const fill = new THREE.DirectionalLight(0xffffff, 0.3); fill.position.set(30, 20, -10); scene.add(fill);
